databases:
  - name: media-intelligence-db
    plan: basic-256mb
    databaseName: media_intelligence
    user: media

services:
  - type: web
    name: media-intelligence-backend
    runtime: python
    plan: starter
    rootDir: backend
    buildCommand: pip install -r requirements.txt && alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: media-intelligence-db
          property: connectionString
      - key: AI_PROVIDER
        value: mock
      # הזינו מפתח Anthropic אמיתי כדי לעבור ל-AI_PROVIDER=anthropic
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-5-5
      - key: CORS_ORIGINS
        value: '["https://media-intelligence-frontend.onrender.com"]'

  - type: web
    name: media-intelligence-frontend
    runtime: node
    plan: starter
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    envVars:
      - key: NEXT_PUBLIC_API_BASE_URL
        value: https://media-intelligence-backend.onrender.com
